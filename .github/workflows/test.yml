name: "test"
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/test.yml"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/test.yml"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  # workflow_call inherits the caller's name; never cancel a sibling gate/caller.
  group: rust-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust tooling
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libvulkan-dev + glslc + spirv-headers let transcribe-cpp-sys build
          # ggml's Vulkan backend (the Linux `vulkan` feature). Mirrors the apt
          # set transcribe.cpp's native-ci uses to build -DTRANSCRIBE_VULKAN=ON.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev \
            libvulkan-dev glslc spirv-headers

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml

  native-rust-tests:
    name: Rust tests (${{ matrix.target }})
    strategy:
      # Retain evidence from both platforms even when one fails.
      fail-fast: false
      matrix:
        include:
          # Existing release runners, with matching host/target architectures.
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    env:
      TEST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust tooling
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Reuse build.yml's Windows x64 native dependencies, not its signing or
      # packaging steps. macOS ARM64 uses the runner SDK and static Metal build.
      - name: Install Vulkan SDK (Windows x64)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install ONNX Runtime (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ORT_VERSION = "1.24.2"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-win-x64-$ORT_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile ort.zip
          Expand-Archive -Path ort.zip -DestinationPath ort-dist -Force
          $ortLib = (Resolve-Path "ort-dist/onnxruntime-win-x64-$ORT_VERSION/lib").Path
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_LIB_LOCATION=$ortLib"
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_PREFER_DYNAMIC_LINK=1"
          # Test executables live in target/<triple>/debug/deps, not beside the
          # staged DLLs. Expose build.rs's staging directory to their loader.
          Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\src-tauri\transcribe-libs"
          Add-Content -Path $env:GITHUB_PATH -Value $ortLib

      - name: Install SPIRV-Headers for transcribe-cpp Vulkan build (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: native-tests-${{ matrix.target }}

      - name: Record tested revision and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          rustc -vV
          cargo --version
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$revision" = "$GITHUB_SHA"
          test "$host" = "$TEST_TARGET"
          {
            echo "### Native Rust regression gate"
            echo "Revision: $revision"
            echo "Host: $host"
            echo "Target: $TEST_TARGET"
            echo "Command: cargo test --locked --manifest-path src-tauri/Cargo.toml --target $TEST_TARGET --lib -- --test-threads=1"
            echo "Full command output, test names, and counts are retained in the Run native Rust tests job log."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run native Rust tests
        shell: bash
        # No filter: includes readiness, startup, switch/cancel ownership,
        # capture suspension/stop, and Secure Input regression tests.
        # Serialize tests sharing native desktop state; do not skip failures.
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target "$TEST_TARGET" --lib -- --test-threads=1
